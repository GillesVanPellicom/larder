name: coquinaria-dev

services:
  db:
    image: postgres:16-alpine
    container_name: coquinaria-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coquinaria
      POSTGRES_PASSWORD: coquinaria_secret
      POSTGRES_DB: coquinaria
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coquinaria -d coquinaria"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  dev_postgres_data:
    driver: local
