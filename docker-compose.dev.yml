name: larder-dev

services:
  db:
    image: postgres:16-alpine
    container_name: larder-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: larder
      POSTGRES_PASSWORD: larder_secret
      POSTGRES_DB: larder
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larder -d larder"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  dev_postgres_data:
    driver: local
