<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Larder" />
    <meta name="description" content="Larder - Culinary Recipe Knowledge Base with Rich Filtering and Conflict Resolution" />
    <title>Larder</title>
    <script>
      (function() {
        try {
          var match = document.cookie.match(/(?:^|;\s*)larder_theme=([^;]+)/) || document.cookie.match(/(?:^|;\s*)coquinaria_theme=([^;]+)/);
          var theme = match ? decodeURIComponent(match[1]) : null;
          if (!theme) {
            var legacy = localStorage.getItem('larder-theme');
            if (legacy === 'light' || legacy === 'dark') theme = legacy;
          }
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
